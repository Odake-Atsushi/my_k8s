apiVersion: v1
kind: Service
metadata:
  name: searxng-service
  labels:
    app: my-SearXNG
spec:
  ports:
    - port: 8888
      targetPort: 8080
  selector:
    app: my-SearXNG
    tier: backend
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-setup-script
data:
  searxng-setting-script.sh: |
    #!/bin/ash

    while [ ! -f /etc/searxng/settings.yml ]; do
      sleep 1  # /etc/searxng/settings.ymlが存在しない場合
    done

    cp /etc/searxng/settings.yml /etc/searxng/settings_default.yml
    echo -e "\n" >> /etc/searxng/settings.yml
    echo "search:" >> /etc/searxng/settings.yml
    echo "  formats:" >> /etc/searxng/settings.yml
    echo "    - html" >> /etc/searxng/settings.yml
    echo "    - json" >> /etc/searxng/settings.yml
    echo -e "\n" >> /etc/searxng/settings.yml
    echo "outgoing:" >> /etc/searxng/settings.yml
    echo "  request_timeout: 60.0" >> /etc/searxng/settings.yml

    #sed -i s/"- html"/"- html\n    - json\n"/g /etc/searxng/settings.yml
    #sed -i s/"request_timeout: 3.0"/"request_timeout: 60.0"/g /etc/searxng/settings.yml

    #if grep -q "json" "$TARGET_FILE"; then
    #  echo "設定はすでに存在するため、スキップします。"
    #else
    #  echo "settings.yml に JSON フォーマットの設定を追加します..."
    #  tee -a "$TARGET_FILE" > /dev/null << 'EOF'

    #search:
    #  formats:
    #    - html
    #    - json
    #EOF

    #  echo "追加が完了しました。"
    #fi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng-deployment
  labels:
    app: my-SearXNG
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-SearXNG
      tier: backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: my-SearXNG
        tier: backend
    spec:
      containers:
        - image: searxng/searxng:latest
          name: searxng
          lifecycle:
            postStart:
              exec:
                command:
                  - "/bin/ash"
                  - "-c"
                  - >
                    ash /usr/local/searxng/searxng-setting-script.sh
          env:
            - name: BASE_URL
              value: "https://search.oahs.f5.si"
              # value: "http://searxng-service.default.svc.cluster.local"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: searxng-setting-script
              mountPath: /usr/local/searxng/searxng-setting-script.sh
              subPath: searxng-setting-script.sh
          resources:
            limits:
              cpu: "125m"
              memory: 512Mi
            requests:
              cpu: "125m"
              memory: 512Mi
      volumes:
        - name: searxng-setting-script # volumeMountsで/etc/nginxにmountするやつ
          configMap:
            name: searxng-setup-script # ConfigMapのnginx-confを/etc/nginx以下に配置する
##########################################################################################

apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  labels:
    app: my-AI-ollama
spec:
  ports:
    - port: 11434
      targetPort: 11434
  selector:
    app: my-AI-ollama
    tier: backend
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-deployment
  labels:
    app: my-AI
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-AI-ollama
      tier: backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: my-AI-ollama
        tier: backend
    spec:
      containers:
        - image: ollama/ollama:latest
          name: ollama
          env:
            - name: OLLAMA_NUM_THREADS
              value: "9"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
          lifecycle:
            postStart:
              exec:
                command:
                  - "/bin/bash"
                  - "-c"
                  - >
                    apt -y update && apt -y install curl &&
                    curl -X POST http://localhost:11434/api/pull -H "Content-Type: application/json" -d "{\"name\": \"gemma4:e4b\"}" &&
                    curl -X POST http://localhost:11434/api/pull -H "Content-Type: application/json" -d "{\"name\": \"gemma4:26b\"}" &&
                    curl -X POST http://localhost:11434/api/pull -H "Content-Type: application/json" -d "{\"name\": \"embeddinggemma:300m\"}"
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: ollama-persistent-storage
              mountPath: /root/.ollama
          resources:
            limits:
              cpu: "9" #"14"
              memory: 32Gi
            requests:
              cpu: "9" #"12"
              memory: 32Gi #16Gi
      volumes:
        - name: ollama-persistent-storage
          persistentVolumeClaim:
            claimName: ollama-pv-claim

--- #NFS
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vaultwarden-backup-data-pv
spec:
  storageClassName: vaultwarden-backup-data
  capacity:
    storage: 256Gi
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: atsushi.local
    path: /mnt/backup/vaultwarden
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-backup-data-pv-claim
  labels:
    app: my-vaultwarden
spec:
  storageClassName: vaultwarden-backup-data
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 256Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-backup-script
data:
  backup.sh: |
    #!/bin/bash

    apt-get -y update
    apt-get -y upgrade
    apt-get -y autopurge
    apt-get -y install rsync
    apt-get -y autoclean

    PERIOD_DAYS=365 #保存期間（日数）

    echo "#####################################################"
    echo "-->  Data Backup !!"

    # Data
    DATADIR="/mnt/data"       #バックアップ元の親ディレクトリ
    BASEDIR="/mnt/backupData" #バックアップ先の親ディレクトリ
    LATESTBKUP=$(ls -v ${BASEDIR} | grep "backup-" | tail -n 1) #直近のバックアップのディレクトリ名
    # バックアップ実行
    rsync --archive --one-file-system --acls --xattrs --stats --human-readable --link-dest="${BASEDIR}/${LATESTBKUP}" "${DATADIR}/" "${BASEDIR}/backup-$(date +%Y%m%d-%H%M%S)"

    # 保存期間を過ぎたバックアップ削除
    while [ $(ls -v ${BASEDIR} | grep -c "backup-") -gt ${PERIOD_DAYS} ]; do
      OLDBACKUP=$(ls -v ${BASEDIR} | grep "backup-" | head -n 1)
      echo "Removing old backup: ${OLDBACKUP}"
      rm -rf "${BASEDIR}/${OLDBACKUP}"
    done

    echo "#####################################################"

    echo "Backup Finish!"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-backup-cronjob
  labels:
    app: my-drupal
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: debian:stable
              imagePullPolicy: IfNotPresent
              env:
                - name: TZ
                  value: Asia/Tokyo
              command:
                - bash
                - /usr/local/bin/backup.sh
              volumeMounts:
                - name: backup-script-file
                  mountPath: /usr/local/bin/
                #data
                - name: vaultwarden-data-persistent-storage
                  mountPath: /mnt/data
                  subPath: data
                #backup
                - name: backup-data-persistent-storage
                  mountPath: /mnt/backupData
                  subPath: data
          restartPolicy: Never
          volumes:
            - name: backup-script-file
              configMap:
                name: vaultwarden-backup-script
            #data
            - name: vaultwarden-data-persistent-storage
              persistentVolumeClaim:
                claimName: drupal-data-pv-claim
            #backup
            - name: backup-data-persistent-storage
              persistentVolumeClaim:
                claimName: vaultwarden-backup-data-pv-claim
